<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2152dc" />
    <!-- Applies a saved light/dark choice before the app loads, so the page never flashes the wrong theme (src/lib/theme.ts). -->
    <script id="theme-init">try{var t=localStorage.getItem('dockbrain-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <meta name="description" content="DockBrain: learn from documents, quiz yourself, and understand codebases with a friendly robot guide." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DockBrain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
